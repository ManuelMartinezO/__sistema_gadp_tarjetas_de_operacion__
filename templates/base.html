<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <style>
        :root {
            --bs-primary: #d97706;    /* Ámbar */
            --bs-dark-red: #8b0000;  /* Bordó */
            --bs-gold: #c5a059;      /* Dorado */
            --bs-body-bg: #fdfdfd;   /* Fondo minimalista */
        }

        body {
            background-color: var(--bs-body-bg);
            min-height: 100vh;
        }

        /* Dashboard Elegante a la Izquierda */
        .sidebar {
            width: 280px;
            background-color: var(--bs-dark-red);
            min-height: 100vh;
            position: fixed;
            transition: all 0.3s;
            box-shadow: 4px 0 10px rgba(0,0,0,0.1);
        }

        .sidebar .logo-area {
            padding: 2rem 1.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            color: var(--bs-gold);
            text-align: center;
        }

        .nav-pills .nav-link {
            color: rgba(255,255,255,0.8);
            border-radius: 10px; /* Bordes redondeados */
            margin: 0.2rem 1rem;
            transition: 0.3s;
        }

        .nav-pills .nav-link:hover {
            background-color: rgba(255,255,255,0.1);
            color: var(--bs-gold);
        }

        .nav-pills .nav-link.active {
            background-color: var(--bs-primary) !important;
            color: white;
        }

        /* Contenido a la Derecha */
        .main-wrapper {
            margin-left: 280px; /* Ancho del sidebar */
            padding: 2rem;
        }

        .content-card {
            background: white;
            border-radius: 15px; /* Bordes redondeados */
            border: 1px solid rgba(0,0,0,0.05);
            padding: 2rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.02);
        }

        .section-divider {
            color: var(--bs-gold);
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
            padding: 1rem 1.5rem 0.5rem;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="sidebar d-flex flex-column">
        <div class="logo-area">
            <h4 class="mb-0 fw-bold">SISTEMA <span style="color:white">PRO</span></h4>
        </div>

        <ul class="nav nav-pills flex-column mb-auto mt-3">
            <li class="nav-item">
                <a href="{% url 'home' %}" class="nav-link active">
                    <i class="bi bi-house-door me-2"></i> Inicio
                </a>
            </li>

            {% if user.is_authenticated %}
                <div class="section-divider">Trámites</div>
                <li><a href="{% url 'tramite:lista_tramites' %}" class="nav-link"><i class="bi bi-file-earmark-text me-2"></i> Lista Trámites</a></li>
                <li><a href="{% url 'operador:lista_operadores' %}" class="nav-link"><i class="bi bi-person-badge me-2"></i> Operadores</a></li>
                <li><a href="{% url 'afiliado:lista_afiliados' %}" class="nav-link"><i class="bi bi-people me-2"></i> Afiliados</a></li>
                <li><a href="{% url 'vehiculo:lista_vehiculos' %}" class="nav-link"><i class="bi bi-car-front me-2"></i> Vehículos</a></li>
                <li><a href="{% url 'tarjeta:lista_tarjetas' %}" class="nav-link"><i class="bi bi-credit-card me-2"></i> Tarjetas</a></li>
                
                <li class="mt-4">
                    <a href="{% url 'logout' %}" class="nav-link text-warning">
                        <i class="bi bi-box-arrow-left me-2"></i> Logout
                    </a>
                </li>
            {% else %}
                <div class="section-divider">Acceso</div>
                <li><a href="{% url 'login' %}" class="nav-link">Login</a></li>
                <li><a href="{% url 'logup' %}" class="nav-link">Logup</a></li>
            {% endif %}
        </ul>
    </div>

    <main class="main-wrapper">
        <div class="container-fluid">
            {% block content %}
            {% endblock %}
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
